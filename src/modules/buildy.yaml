project:
  name: mobius-modules
  description: "Built-in Mobius plugin modules"

targets:
  shared_libraries:
    - name: compression
      language: cpp
      output_prefix: ""
      sources: ["compression/compression_plugin.cpp"]
      include_dirs:
        - "${workspace}/include"
        - "${workspace}/src"
        - "${workspace}/src/mobius"
        - "${workspace}/src/modules/compression"
      libs: ["mobius-core", "zstd", {linux: ["dl"]}]
      depends_on:
        targets: ["mobius-core"]

    - name: io
      language: cpp
      output_prefix: ""
      sources:
        - "io/io_plugin.cpp"
        - linux: ["io/io_platform_posix.cpp"]
        - macos: ["io/io_platform_posix.cpp"]
        - windows: ["io/io_platform_win32.cpp"]
      include_dirs:
        - "${workspace}/include"
        - "${workspace}/src"
        - "${workspace}/src/mobius"
      libs: ["mobius-core", {linux: ["dl"]}]
      depends_on:
        targets: ["mobius-core"]

    - name: process
      language: cpp
      output_prefix: ""
      sources:
        - "process/process_plugin.cpp"
        - linux: ["process/process_platform_posix.cpp", "process/process_platform_linux.cpp", "io/io_platform_posix.cpp"]
        - macos: ["process/process_platform_posix.cpp", "process/process_platform_macos.cpp", "io/io_platform_posix.cpp"]
        - windows: ["process/process_platform_win32.cpp", "io/io_platform_win32.cpp"]
      include_dirs:
        - "${workspace}/include"
        - "${workspace}/src"
        - "${workspace}/src/mobius"
        - "${workspace}/src/modules"
      libs: ["mobius-core", {linux: ["dl"]}]
      depends_on:
        targets: ["mobius-core"]

    - name: math
      language: cpp
      output_prefix: ""
      sources: ["math/math_plugin.cpp"]
      include_dirs:
        - "${workspace}/include"
        - "${workspace}/src"
        - "${workspace}/src/mobius"
      libs: ["mobius-core", {linux: ["m", "dl"]}]
      depends_on:
        targets: ["mobius-core"]

    - name: os
      language: cpp
      output_prefix: ""
      sources:
        - "os/os_plugin.cpp"
        - linux: ["os/os_platform_posix.cpp", "os/os_platform_linux.cpp", "internal/module_platform_posix.cpp"]
        - macos: ["os/os_platform_posix.cpp", "os/os_platform_macos.cpp", "internal/module_platform_posix.cpp"]
        - windows: ["os/os_platform_win32.cpp", "internal/module_platform_win32.cpp"]
      include_dirs:
        - "${workspace}/include"
        - "${workspace}/src"
        - "${workspace}/src/mobius"
      libs: ["mobius-core", {linux: ["dl"]}]
      depends_on:
        targets: ["mobius-core"]

    - name: regex
      language: cpp
      output_prefix: ""
      sources:
        - "regex/regex_plugin.cpp"
        - "regex/regex_engine.cpp"
      include_dirs:
        - "${workspace}/include"
        - "${workspace}/src"
        - "${workspace}/src/mobius"
      libs: ["mobius-core", {linux: ["dl"]}]
      depends_on:
        targets: ["mobius-core"]

    - name: json
      language: cpp
      output_prefix: ""
      sources: ["json/json_plugin.cpp"]
      include_dirs:
        - "${workspace}/include"
        - "${workspace}/src"
        - "${workspace}/src/mobius"
      libs: ["mobius-core", {linux: ["dl"]}]
      depends_on:
        targets: ["mobius-core"]

    - name: toml
      language: cpp
