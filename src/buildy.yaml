project:
  name: mobius-core
  description: "Mobius interpreter library and CLI"

targets:
  # The OS layer (platform/mobius_platform.h), linked into the core and the
  # executables. Position-independent (it goes into the core library) and
  # hidden (the core doesn't export it).
  static_libraries:
    - name: mobius-platform
      language: cpp
      sources:
        - linux: ["mobius/platform/mobius_platform_posix.cpp", "mobius/platform/mobius_platform_linux.cpp", "mobius/platform/fiber_context.cpp"]
        - macos: ["mobius/platform/mobius_platform_posix.cpp", "mobius/platform/mobius_platform_macos.cpp", "mobius/platform/fiber_context.cpp"]
        - windows: ["mobius/platform/mobius_platform_win32.cpp"]
      include_dirs:
        - "${workspace}/include"
        - "${workspace}/src/mobius"
      flags:
        - linux: ["-fPIC", "-fvisibility=hidden"]
        - macos: ["-fPIC", "-fvisibility=hidden"]
      # The workspace's C runtime link flags are for the linker, not the
      # archiver (lib.exe).
      link:
        remove_flags:
          - windows: ["/NODEFAULTLIB:libucrt.lib", "/DEFAULTLIB:ucrt.lib"]

  shared_libraries:
    - name: mobius-core
      language: cpp
      sources:
        - "mobius/data/*.cpp"
        - "mobius/fiber/*.cpp"
        - "mobius/frontend/*.cpp"
        - "mobius/internal/*.cpp"
        - "mobius/library/*.cpp"
        - "mobius/plugin/*.cpp"
        - "mobius/state/*.cpp"
        - "mobius/util/*.cpp"
        - "mobius/vm/*.cpp"
        - "mobius/repl.cpp"
      include_dirs:
        - "${workspace}/include"
        - "${workspace}/src"
        - "${workspace}/src/mobius"
      flags:
        - "-DMOBIUS_BUILDING"
        - linux: ["-fvisibility=hidden"]
        - macos: ["-fvisibility=hidden"]
      # The SONAME lets plugins (which name libmobius-core.so as a needed
      # library) bind to a copy already loaded from any path, e.g. by a
      # standalone bundle's launcher.
      link:
        flags:
          - linux: ["-Wl,-soname,libmobius-core.so"]
          - macos: ["-Wl,-install_name,@rpath/libmobius-core.dylib"]
      lib_dirs: ["${workspace}/build/${platform}-${arch}-${config}/lib"]
      libs: ["mobius-platform", {linux: ["pthread", "dl"]}, {windows: ["ws2_32"]}]
      depends_on:
        targets: ["mobius-platform"]

  # Both parse and compile scripts on the main thread, recursively: give it
  # 8 MiB on Windows too (its default is 1 MiB; Linux's and macOS's is
  # 8 MiB), so the parser's nesting limit is reached before the stack ends.
  executables:
    - name: mobius-launcher
      language: cpp
      sources: ["launcher/launcher.cpp"]
      include_dirs:
        - "${workspace}/include"
        - "${workspace}/src/mobius"
      link:
        flags:
          - windows: ["/STACK:8388608"]
      lib_dirs: ["${workspace}/build/${platform}-${arch}-${config}/lib"]
      libs: ["mobius-platform", {linux: ["dl"]}, {windows: ["ws2_32"]}]
      depends_on:
        targets: ["mobius-platform"]

    - name: mobius
      language: cpp
      sources: ["main.cpp"]
      include_dirs:
        - "${workspace}/include"
        - "${workspace}/src"
        - "${workspace}/src/mobius"
      link:
        flags:
          - windows: ["/STACK:8388608"]
      lib_dirs: ["${workspace}/build/${platform}-${arch}-${config}/lib"]
      libs: ["mobius-core", "mobius-platform", {linux: ["m", "dl", "pthread"]}, {windows: ["ws2_32"]}]
      depends_on:
        targets: ["mobius-core", "mobius-platform"]
