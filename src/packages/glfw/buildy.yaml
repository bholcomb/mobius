project:
  name: mobius-glfw-package
  description: "GLFW package candidate for Mobius"

environment:
  compile:
    cpp_standard: "c++17"
    warnings: extra

targets:
  shared_libraries:
    - name: glfw
      language: cpp
      output_prefix: ""
      sources: ["glfw_plugin.cpp"]
      # Only the public headers: a package uses only the C API.
      include_dirs: ["${workspace}/include"]
      libs: ["mobius-core"]
      deps: ["glfw3"]
      depends_on:
        targets: ["mobius-core"]
