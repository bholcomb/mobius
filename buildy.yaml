project:
  name: mobius
  version: "0.1.0"
  description: "Mobius Scripting Language"

environment:
  compile:
    cpp_standard: "c++17"
    warnings: extra
    flags: []

  configurations:
    debug:
      optimization: none
      symbols: true
    # GCC/Clang flags on Linux and macOS; on Windows (MSVC) the build
    # tool's own optimization settings apply.
    release:
      optimization: speed
      defines: ["NDEBUG"]
      compile:
        remove_flags: ["-O2"]
        flags:
          - linux: ["-O3", "-march=native", "-funroll-loops", "-flto"]
          - macos: ["-O3", "-funroll-loops", "-flto"]
      link:
        flags:
          - linux: ["-flto", "-Wl,-O1"]
          - macos: ["-flto"]
    # Release build for distribution (standalone bundles). On Linux, a CPU
    # baseline any x86-64 machine from ~2009 on supports, instead of this
    # machine's; elsewhere the same as release, which already targets the
    # platform's baseline.
    portable:
      optimization: speed
      defines: ["NDEBUG"]
      compile:
        remove_flags: ["-O2"]
        flags:
          - linux: ["-O3", "-march=x86-64-v2", "-funroll-loops", "-flto"]
          - macos: ["-O3", "-funroll-loops", "-flto"]
      link:
        flags:
          - linux: ["-flto", "-Wl,-O1"]
          - macos: ["-flto"]

workspace:
  modules:
    - src
    - src/modules
    - src/packages/sqlite
    - src/packages/glfw
      #    - src/packages/vulkease
      #    - src/packages/monstro
    - examples

dependencies:
  file: buildy_config/dependencies.yaml


staging:
  name: "mobius"
  destination: "${workspace}"
  contents:
    - folder: "bin"
      files:
        - linux: ["${out_dir}/bin/mobius", "${out_dir}/bin/mobius-launcher", "${out_dir}/bin/libmobius-core.so"]
        - macos: ["${out_dir}/bin/mobius", "${out_dir}/bin/libmobius-core.dylib"]
        - windows: ["${out_dir}/bin/mobius.exe", "${out_dir}/bin/mobius-core.dll"]
    - folder: "bin/modules/compression"
      files:
        - "src/modules/compression/module.yaml"
        - "src/modules/compression/compression.mob"
    - folder: "bin/modules/compression/native/${platform}-${arch}"
      files:
        - linux: ["${out_dir}/bin/compression.so"]
        - windows: ["${out_dir}/bin/compression.dll"]
        - macos: ["${out_dir}/bin/compression.dylib"]
